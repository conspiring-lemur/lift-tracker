<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lift Tracker</title>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lifts">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="navbar" class="navbar" aria-hidden="true"><span id="nav-title"></span></div>
  <main id="main"></main>

  <div id="rest" class="rest" hidden>
    <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-bg" cx="18" cy="18" r="15.5" pathLength="100"/><circle class="ring-fg" cx="18" cy="18" r="15.5" pathLength="100"/></svg>
    <div class="rest-text"><span class="rest-label">Rest</span><span class="rest-time">2:00</span></div>
    <button data-rest="sub" aria-label="30 seconds less">−30</button>
    <button data-rest="add" aria-label="30 seconds more">+30</button>
    <button data-rest="skip" class="rest-skip">Skip</button>
  </div>

  <button id="mini" class="mini" data-act="resume" hidden>
    <span class="mini-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="10.8" width="19" height="2.4" rx="1.2" fill="currentColor"/><rect x="5" y="6.5" width="3" height="11" rx="1.2" fill="currentColor"/><rect x="16" y="6.5" width="3" height="11" rx="1.2" fill="currentColor"/></svg></span>
    <span class="mini-text"><span class="mini-name"></span><span class="mini-sub"></span></span>
    <span class="mini-go">Resume</span>
  </button>

  <nav class="tabbar" aria-label="Sections">
    <button data-act="tab" data-tab="today"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="12.6" width="24" height="2.8" rx="1.4" fill="currentColor"/><rect x="5" y="7" width="4" height="14" rx="1.6" fill="currentColor"/><rect x="19" y="7" width="4" height="14" rx="1.6" fill="currentColor"/><rect x="1.5" y="10" width="2.5" height="8" rx="1.2" fill="currentColor"/><rect x="24" y="10" width="2.5" height="8" rx="1.2" fill="currentColor"/></svg>Today</button>
    <button data-act="tab" data-tab="history"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="4" y="5.5" width="20" height="19" rx="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4 11h20" stroke="currentColor" stroke-width="2.2"/><path d="M9.5 3v5M18.5 3v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="16" r="1.5" fill="currentColor"/><circle cx="14" cy="16" r="1.5" fill="currentColor"/><circle cx="18" cy="16" r="1.5" fill="currentColor"/><circle cx="10" cy="20" r="1.5" fill="currentColor"/><circle cx="14" cy="20" r="1.5" fill="currentColor"/></svg>History</button>
    <button data-act="tab" data-tab="progress"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3.5 20.5l6.5-7 5 4.5 9.5-11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 7h6v6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Progress</button>
    <button data-act="tab" data-tab="program"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 8h18M5 14h18M5 20h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="10" cy="8" r="2.6" fill="var(--tab-bg)" stroke="currentColor" stroke-width="2.2"/><circle cx="18" cy="14" r="2.6" fill="var(--tab-bg)" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="20" r="2.6" fill="var(--tab-bg)" stroke="currentColor" stroke-width="2.2"/></svg>Program</button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <label id="hap" class="hap" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
